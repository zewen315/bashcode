services:
  # Builds and tags the judge sandbox image on the host's Docker daemon.
  # Not meant to run as a long-lived container — the backend service
  # invokes `docker run bashcode-sandbox:latest ...` itself via the
  # mounted socket, so this just needs to exist and be tagged.
  sandbox-image:
    build:
      context: judge
    image: bashcode-sandbox:latest
    command: ["true"]
    restart: "no"

  # Self-hosted on the same droplet. max_connections is capped low —
  # this app's pool never opens more than 5 connections (see
  # web/backend/db.py) and a small droplet has no room for Postgres's
  # much larger default. The healthcheck matters: a plain `depends_on`
  # only waits for the container to start, not for Postgres to be
  # ready to accept connections (which takes a few seconds on first
  # boot) — without it, `backend`'s startup migration can race a cold
  # `docker compose up` and crash-loop until Postgres catches up.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bashcode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bashcode}
      POSTGRES_DB: ${POSTGRES_DB:-bashcode}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback-only: safe to publish even on the public droplet (not
      # reachable off-box), but still lets a developer `psql` in from
      # the host for local dev/debugging. backend<->postgres traffic
      # itself goes over the compose bridge network via the service
      # name below, never through this published port.
      - "127.0.0.1:5432:5432"
    command: postgres -c max_connections=20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bashcode} -d $${POSTGRES_DB:-bashcode}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    restart: unless-stopped
    environment:
      # Identical values as the volume targets below, deliberately — see
      # the Docker-outside-of-Docker note in web/backend/main.py.
      BASHCODE_PROBLEMS_DIR: ${BASHCODE_PROBLEMS_PATH}
      BASHCODE_SCRATCH_DIR: ${BASHCODE_SCRATCH_PATH}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bashcode}:${POSTGRES_PASSWORD:-bashcode}@postgres:5432/${POSTGRES_DB:-bashcode}
      # A var existing in .env does NOT automatically reach the
      # container — compose only passes through what's explicitly
      # listed here.
      RESEND_API_KEY: ${RESEND_API_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      AVATAR_UPLOAD_DIR: /app/uploads/avatars
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Source and target are the SAME absolute host path on purpose:
      # this container's `docker run -v ...` calls go to the HOST
      # daemon, which resolves those paths against its own filesystem,
      # not this container's. A remapped path (e.g. ...:/problems)
      # would work for this container's own reads but silently break
      # every judge run, since the host daemon can't find "/problems".
      - ${BASHCODE_PROBLEMS_PATH}:${BASHCODE_PROBLEMS_PATH}:ro
      - ${BASHCODE_SCRATCH_PATH}:${BASHCODE_SCRATCH_PATH}
      # A normal named volume, unlike the two above — no Docker-outside-
      # of-Docker path-matching constraint here, since nothing ever
      # shells out to the host daemon for this path.
      - avatar_uploads:/app/uploads
    expose:
      - "8000"
    depends_on:
      sandbox-image:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: web/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  avatar_uploads:
